<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Título y SEO para Búsquedas en Google -->
  <title>Adivina el escudo: Versión Uruguaya</title>
  <meta name="description" content="Juego de trivia para adivinar los escudos del fútbol uruguayo de Primera y Segunda División. ¡Jugá en solitario o competí contra un bot!">
  <meta name="keywords" content="adivina el escudo, futbol uruguayo, auf, peñarol, nacional, trivia futbol uruguay, juego de escudos">
  <meta name="robots" content="index, follow">

  <!-- Favicon e Ícono oficial de la AUF -->
  <link rel="icon" type="image/jpeg" href="https://i.pinimg.com/1200x/d0/6e/47/d06e47472600f9da6d35e8caaf90527f.jpg">

  <!-- Configuración PWA (Para instalar como App en Celulares y PC) -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://i.pinimg.com/1200x/d0/6e/47/d06e47472600f9da6d35e8caaf90527f.jpg">
  <meta name="theme-color" content="#0d1b2a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Escudos UY">

  <!-- Registro del Service Worker para PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>

  <!-- Estilos CSS del Juego -->
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0d1b2a, #1b263b);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .card {
      background: #101d2d;
      border: 2px solid #00b4d8;
      border-radius: 16px;
      padding: 25px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
      position: relative;
    }

    h1 {
      color: #90e0ef;
      font-size: 1.8rem;
      margin-top: 0;
      margin-bottom: 5px;
    }

    p.subtitle {
      color: #a8dadc;
      font-size: 0.95rem;
      margin-bottom: 20px;
    }

    /* Barra de usuario y botón de cerrar sesión */
    .user-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1b263b;
      padding: 8px 15px;
      border-radius: 30px;
      margin-bottom: 15px;
      font-size: 0.85rem;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-bar img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1.5px solid #00b4d8;
    }

    .btn-logout {
      background: #e63946;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-logout:hover {
      background: #b71c1c;
    }

    .timer-container {
      background: #1b263b;
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 15px;
    }

    .timer-bar {
      height: 100%;
      background: #00b4d8;
      width: 100%;
      transition: width 1s linear;
    }

    .clues-container {
      background: #1b263b;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
      text-align: left;
    }

    .clue {
      margin: 10px 0;
      font-size: 1rem;
      line-height: 1.4;
      color: #e0e1dd;
    }

    .clue span {
      color: #00b4d8;
      font-weight: bold;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 15px;
      border-radius: 8px;
      border: 1px solid #415a77;
      background: #0d1b2a;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #00b4d8;
    }

    button {
      background: #00b4d8;
      color: #0d1b2a;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover {
      background: #90e0ef;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background: #415a77;
      color: #fff;
    }

    .btn-secondary:hover {
      background: #778da9;
    }

    .btn-google {
      background: #ffffff;
      color: #333;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      font-size: 0.95rem;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .btn-google img {
      width: 18px;
      height: 18px;
    }

    .message {
      font-weight: bold;
      font-size: 1.1rem;
      min-height: 28px;
      margin-top: 10px;
    }

    .correct { color: #52b788; }
    .incorrect { color: #e63946; }
    .bot-msg { color: #ffb703; }

    .score-board {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      font-size: 0.9rem;
      color: #a8dadc;
      border-top: 1px solid #415a77;
      padding-top: 15px;
    }

    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      text-align: left;
      font-size: 0.9rem;
    }

    .leaderboard-table th, .leaderboard-table td {
      padding: 8px;
      border-bottom: 1px solid #415a77;
      vertical-align: middle;
    }

    .leaderboard-table th {
      color: #00b4d8;
    }

    .player-cell {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .player-cell img {
      width: 26px;
      height: 26px;
      border-radius: 50%;
    }

    .mode-select {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }

    .bot-difficulty {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
    }

    .hidden { display: none !important; }
  </style>

  <!-- Módulo Firebase (Autenticación y Firestore) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, signOut, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBR1oL9oUy7TlAvcesJQVFu9FuqNSohoXA",
      authDomain: "adivinaelescudouruguayo.firebaseapp.com",
      projectId: "adivinaelescudouruguayo",
      storageBucket: "adivinaelescudouruguayo.firebasestorage.app",
      messagingSenderId: "83952093183",
      appId: "1:83952093183:web:4f321748c1eb6abffb49ca"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;

    const googleBtn = document.getElementById('google-btn');
    const userBar = document.getElementById('user-bar');
    const userNameEl = document.getElementById('user-name');
    const userPicEl = document.getElementById('user-pic');
    const logoutBtn = document.getElementById('logout-btn');

    // Iniciar Sesión con Google
    googleBtn.addEventListener('click', async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (err) {
        console.error("Error al iniciar sesión:", err);
      }
    });

    // Cerrar Sesión
    logoutBtn.addEventListener('click', async () => {
      try {
        await signOut(auth);
      } catch (err) {
        console.error("Error al cerrar sesión:", err);
      }
    });

    // Observador del Estado de Usuario
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        userNameEl.textContent = user.displayName;
        userPicEl.src = user.photoURL || 'https://via.placeholder.com/32';
        userBar.classList.remove('hidden');
        googleBtn.classList.add('hidden');
      } else {
        currentUser = null;
        userBar.classList.add('hidden');
        googleBtn.classList.remove('hidden');
      }
    });

    window.saveScoreToFirebase = async function(finalScore) {
      if (!currentUser) return;

      const userRef = doc(db, "scores", currentUser.uid);
      const docSnap = await getDoc(userRef);

      let record = finalScore;
      if (docSnap.exists()) {
        const prevScore = docSnap.data().highScore || 0;
        if (finalScore <= prevScore) {
          record = prevScore;
        }
      }

      await setDoc(userRef, {
        name: currentUser.displayName,
        photo: currentUser.photoURL,
        highScore: record,
        updatedAt: new Date()
      }, { merge: true });
    };

    window.loadLeaderboard = async function() {
      try {
        const q = query(collection(db, "scores"), orderBy("highScore", "desc"), limit(5));
        const querySnapshot = await getDocs(q);
        
        let html = '<table class="leaderboard-table"><tr><th>#</th><th>Jugador</th><th>Puntos</th></tr>';
        let i = 1;
        querySnapshot.forEach((doc) => {
          const data = doc.data();
          const avatar = data.photo || 'https://via.placeholder.com/26';
          html += `<tr>
            <td>${i++}</td>
            <td>
              <div class="player-cell">
                <img src="${avatar}" alt="Avatar">
                <span>${data.name}</span>
              </div>
            </td>
            <td><strong>${data.highScore}</strong></td>
          </tr>`;
        });
        html += '</table>';
        return html;
      } catch (e) {
        return '<p style="font-size:0.85rem; color:#a8dadc;">Iniciá sesión para figurar en el ránking mundial.</p>';
      }
    };
  </script>
</head>
