<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adivina el escudo: Versión Uruguaya</title>
  
  <!-- Logo / Favicon oficial de la AUF -->
  <link rel="icon" type="image/jpeg" href="https://i.pinimg.com/1200x/d0/6e/47/d06e47472600f9da6d35e8caaf90527f.jpg">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0d1b2a, #1b263b);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .card {
      background: #101d2d;
      border: 2px solid #00b4d8;
      border-radius: 16px;
      padding: 25px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
      position: relative;
    }

    h1 {
      color: #90e0ef;
      font-size: 1.8rem;
      margin-top: 0;
      margin-bottom: 5px;
    }

    p.subtitle {
      color: #a8dadc;
      font-size: 0.95rem;
      margin-bottom: 20px;
    }

    /* User Profile Bar */
    .user-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #1b263b;
      padding: 8px 12px;
      border-radius: 30px;
      margin-bottom: 15px;
      font-size: 0.85rem;
    }

    .user-bar img {
      width: 28px;
      height: 28px;
      border-radius: 50%;
    }

    .timer-container {
      background: #1b263b;
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 15px;
    }

    .timer-bar {
      height: 100%;
      background: #00b4d8;
      width: 100%;
      transition: width 1s linear;
    }

    .clues-container {
      background: #1b263b;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
      text-align: left;
    }

    .clue {
      margin: 10px 0;
      font-size: 1rem;
      line-height: 1.4;
      color: #e0e1dd;
    }

    .clue span {
      color: #00b4d8;
      font-weight: bold;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 15px;
      border-radius: 8px;
      border: 1px solid #415a77;
      background: #0d1b2a;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #00b4d8;
    }

    button {
      background: #00b4d8;
      color: #0d1b2a;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover {
      background: #90e0ef;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-google {
      background: #ffffff;
      color: #333;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      font-size: 0.95rem;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .btn-google img {
      width: 18px;
      height: 18px;
    }

    .message {
      font-weight: bold;
      font-size: 1.1rem;
      min-height: 28px;
      margin-top: 10px;
    }

    .correct { color: #52b788; }
    .incorrect { color: #e63946; }

    .score-board {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      font-size: 0.9rem;
      color: #a8dadc;
      border-top: 1px solid #415a77;
      padding-top: 15px;
    }

    /* Leaderboard Table */
    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      text-align: left;
      font-size: 0.9rem;
    }

    .leaderboard-table th, .leaderboard-table td {
      padding: 8px;
      border-bottom: 1px solid #415a77;
    }

    .leaderboard-table th {
      color: #00b4d8;
    }

    .hidden { display: none !important; }
  </style>

  <!-- Firebase Modular SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Tu configuración oficial de Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBR1oL9oUy7TlAvcesJQVFu9FuqNSohoXA",
      authDomain: "adivinaelescudouruguayo.firebaseapp.com",
      projectId: "adivinaelescudouruguayo",
      storageBucket: "adivinaelescudouruguayo.firebasestorage.app",
      messagingSenderId: "83952093183",
      appId: "1:83952093183:web:4f321748c1eb6abffb49ca"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;

    // Elementos del DOM
    const googleBtn = document.getElementById('google-btn');
    const userBar = document.getElementById('user-bar');
    const userNameEl = document.getElementById('user-name');
    const userPicEl = document.getElementById('user-pic');

    // Login Event
    googleBtn.addEventListener('click', async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (err) {
        console.error("Error al iniciar sesión:", err);
      }
    });

    // Observer de autenticación
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        userNameEl.textContent = user.displayName;
        userPicEl.src = user.photoURL || 'https://via.placeholder.com/28';
        userBar.classList.remove('hidden');
        googleBtn.classList.add('hidden');
      } else {
        currentUser = null;
        userBar.classList.add('hidden');
        googleBtn.classList.remove('hidden');
      }
    });

    // Guardar récord en Firestore
    window.saveScoreToFirebase = async function(finalScore) {
      if (!currentUser) return;

      const userRef = doc(db, "scores", currentUser.uid);
      const docSnap = await getDoc(userRef);

      let record = finalScore;
      if (docSnap.exists()) {
        const prevScore = docSnap.data().highScore || 0;
        if (finalScore <= prevScore) {
          record = prevScore; // Mantener el récord más alto
        }
      }

      await setDoc(userRef, {
        name: currentUser.displayName,
        photo: currentUser.photoURL,
        highScore: record,
        updatedAt: new Date()
      }, { merge: true });
    };

    // Obtener Top Récords
    window.loadLeaderboard = async function() {
      try {
        const q = query(collection(db, "scores"), orderBy("highScore", "desc"), limit(5));
        const querySnapshot = await getDocs(q);
        
        let html = '<table class="leaderboard-table"><tr><th>#</th><th>Jugador</th><th>Puntos</th></tr>';
        let i = 1;
        querySnapshot.forEach((doc) => {
          const data = doc.data();
          html += `<tr>
            <td>${i++}</td>
            <td>${data.name}</td>
            <td><strong>${data.highScore}</strong></td>
          </tr>`;
        });
        html += '</table>';
        return html;
      } catch (e) {
        return '<p style="font-size:0.85rem; color:#a8dadc;">Iniciá sesión con Google para registrar tu récord global.</p>';
      }
    };
  </script>
</head>
<body>

  <div class="card">
    <h1>Adivina el escudo: Versión Uruguaya</h1>
    <p class="subtitle">12 Preguntas de la Primera División</p>

    <!-- Usuario autenticado -->
    <div id="user-bar" class="user-bar hidden">
      <img id="user-pic" src="" alt="Perfil">
      <span id="user-name"></span>
    </div>

    <!-- Botón de Login -->
    <button id="google-btn" class="btn-google">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
      Iniciar sesión con Google
    </button>

    <!-- Pantalla de Inicio -->
    <div id="start-screen">
      <p style="color:#e0e1dd; margin-bottom:20px;">
        Iniciá sesión para guardar tus récords o jugá en modo invitado.
      </p>
      <button onclick="startGame()">▶ ¡JUGAR!</button>
    </div>

    <!-- Pantalla de Juego -->
    <div id="game-screen" class="hidden">
      <div class="timer-container">
        <div id="timer-bar" class="timer-bar"></div>
      </div>

      <div class="clues-container">
        <div class="clue"><span>Pista 1:</span> <span id="clue1">---</span></div>
        <div class="clue"><span>Pista 2:</span> <span id="clue2">---</span></div>
      </div>

      <div class="input-group">
        <input type="text" id="user-input" placeholder="Escribí el club..." autocomplete="off">
        <button onclick="checkAnswer()">Enviar</button>
      </div>

      <div id="message" class="message"></div>

      <div class="score-board">
        <span>Puntaje: <strong id="score">0</strong></span>
        <span>Tiempo: <strong id="time-text">15s</strong></span>
        <span>Ronda: <strong id="round">1</strong>/12</span>
      </div>
    </div>

    <!-- Pantalla Final -->
    <div id="end-screen" class="hidden">
      <h2>¡Juego Terminado!</h2>
      <p style="font-size: 1.2rem; color:#90e0ef;">Obtuviste <strong id="final-score">0</strong> puntos.</p>

      <div id="leaderboard-container">
        <h3 style="color:#00b4d8; margin-top:20px;">🏆 Mejores Récords</h3>
        <div id="leaderboard-content">Cargando récords...</div>
      </div>

      <button style="margin-top:20px;" onclick="restartGame()">Jugar de nuevo</button>
    </div>
  </div>

  <script>
    // Sintetizador Web Audio API (Efectos de Sonido)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'correct') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
        osc.frequency.exponentialRampToValueAtTime(659.25, audioCtx.currentTime + 0.15); // E5
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      } else if (type === 'incorrect') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      }
    }

    // 12 Clubes de Primera División
    const clubs = [
      { names: ["penarol", "peñarol"], clue1: "Tiene 5 Copas Libertadores y viste de amarillo y negro.", clue2: "Su estadio es el Campeón del Siglo." },
      { names: ["nacional"], clue1: "Su estadio es el Gran Parque Central.", clue2: "Tiene 3 Copas Intercontinentales y viste de blanco, azul y rojo." },
      { names: ["defensor sporting", "defensor"], clue1: "Juega en el Estadio Luis Franzini en el Parque Rodó.", clue2: "Viste indumentaria de color violeta." },
      { names: ["danubio"], clue1: "Juega de local en Jardines del Hipódromo.", clue2: "Camiseta blanca con una franja diagonal negra." },
      { names: ["liverpool"], clue1: "Su estadio se llama Belvedere en el barrio Cuchilla Grande.", clue2: "Viste franjas verticales azules y negras." },
      { names: ["wanderers", "montevideo wanderers"], clue1: "Juega en el Parque Alfredo Víctor Viera en el Prado.", clue2: "Su camiseta es a bastones negros y blancos." },
      { names: ["boston river"], clue1: "Apodado el 'Sastre', suele jugar como local en Florida.", clue2: "Combina los colores verde y rojo." },
      { names: ["cerro"], clue1: "Su casa es el Estadio Monumental Luis Tróccoli.", clue2: "Camiseta albiceleste a franjas verticales." },
      { names: ["progreso"], clue1: "Ubicado en el barrio La Teja, juega en el Estadio Abraham Paladino.", clue2: "Viste franjas amarillas y rojas." },
      { names: ["deportivo maldonado"], clue1: "Equipo del interior, juega en el Estadio Domingo Burgueño Miguel.", clue2: "Sus colores representativos son el rojo y el verde." },
      { names: ["racing"], clue1: "Conocido como la 'Escuelita Sayaguense'.", clue2: "Juega en el Parque Osvaldo Roberto y viste de verde y blanco." },
      { names: ["river plate"], clue1: "Su estadio es el Parque Federico Omar Saroldi.", clue2: "Viste camiseta a franjas verticales rojas y blancas." }
    ];

    let currentClubIndex = 0;
    let score = 0;
    let round = 1;
    let timer;
    let timeLeft = 15;

    function normalizeText(text) {
      return text.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
    }

    function startGame() {
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');
      clubs.sort(() => Math.random() - 0.5);
      showClub();
    }

    function showClub() {
      const club = clubs[currentClubIndex];
      document.getElementById('clue1').textContent = club.clue1;
      document.getElementById('clue2').textContent = club.clue2;
      document.getElementById('user-input').value = '';
      document.getElementById('message').textContent = '';
      document.getElementById('user-input').focus();
      
      startTimer();
    }

    function startTimer() {
      clearInterval(timer);
      timeLeft = 15;
      updateTimerUI();

      timer = setInterval(() => {
        timeLeft--;
        updateTimerUI();

        if (timeLeft <= 0) {
          clearInterval(timer);
          playSound('incorrect');
          handleTimeout();
        }
      }, 1000);
    }

    function updateTimerUI() {
      document.getElementById('time-text').textContent = `${timeLeft}s`;
      const percentage = (timeLeft / 15) * 100;
      document.getElementById('timer-bar').style.width = `${percentage}%`;
    }

    function checkAnswer() {
      clearInterval(timer);
      const input = normalizeText(document.getElementById('user-input').value);
      const currentClub = clubs[currentClubIndex];
      const messageEl = document.getElementById('message');

      if (!input) {
        startTimer();
        return;
      }

      const isCorrect = currentClub.names.some(name => normalizeText(name) === input);

      if (isCorrect) {
        score += 10;
        playSound('correct');
        messageEl.textContent = "¡Correcto! +10 pts";
        messageEl.className = "message correct";
      } else {
        playSound('incorrect');
        messageEl.textContent = `Incorrecto. Era ${currentClub.names[0].toUpperCase()}`;
        messageEl.className = "message incorrect";
      }

      document.getElementById('score').textContent = score;
      nextRound();
    }

    function handleTimeout() {
      const currentClub = clubs[currentClubIndex];
      const messageEl = document.getElementById('message');
      messageEl.textContent = `¡Tiempo agotado! Era ${currentClub.names[0].toUpperCase()}`;
      messageEl.className = "message incorrect";
      nextRound();
    }

    function nextRound() {
      setTimeout(async () => {
        currentClubIndex++;
        if (currentClubIndex < clubs.length) {
          round++;
          document.getElementById('round').textContent = round;
          showClub();
        } else {
          await endGame();
        }
      }, 1500);
    }

    async function endGame() {
      document.getElementById('game-screen').classList.add('hidden');
      document.getElementById('end-screen').classList.remove('hidden');
      document.getElementById('final-score').textContent = score;

      // Guardar puntaje en Firebase si hay usuario logueado
      if (window.saveScoreToFirebase) {
        await window.saveScoreToFirebase(score);
      }

      // Cargar tabla de récords
      if (window.loadLeaderboard) {
        const leaderboardHTML = await window.loadLeaderboard();
        document.getElementById('leaderboard-content').innerHTML = leaderboardHTML;
      }
    }

    function restartGame() {
      score = 0;
      round = 1;
      currentClubIndex = 0;
      document.getElementById('score').textContent = '0';
      document.getElementById('round').textContent = '1';
      document.getElementById('end-screen').classList.add('hidden');
      startGame();
    }

    document.getElementById('user-input').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') checkAnswer();
    });
  </script>
</body>
</html>
